version: "3"

dotenv: [".env"]

vars:
  DB_URL: "{{.DATABASE_URL}}"
  MIGRATIONS: migrations

tasks:
  cover:
    cmds:
      - go test ./... -coverpkg=./... -coverprofile=raw_coverage.out
      - grep -vE '/(actortest|accounttest)/' raw_coverage.out > coverage.out

  squawk: squawk '{{.MIGRATIONS}}/*.sql'

  sqlc:
    - sqlc generate -f sqlc.yaml
    - sqlc vet -f sqlc.yaml

  openapi:
    desc: Export the API spec (api/openapi.yaml) and regenerate the CLI client from it
    cmds:
      - go run ./cmd/server openapi > api/openapi.yaml
      - go tool oapi-codegen -config oapi-codegen.yaml api/openapi.yaml

  migrate:create:
    requires:
      vars: [CLI_ARGS]
    cmd: migrate create -ext sql -dir {{.MIGRATIONS}} -seq {{.CLI_ARGS}}

  migrate:up:
    desc: Apply all pending migrations
    cmd: migrate -path {{.MIGRATIONS}} -database "{{.DB_URL}}" up

  migrate:down:
    desc: Roll back last migration
    cmd: migrate -path {{.MIGRATIONS}} -database "{{.DB_URL}}" down 1

  migrate:force:
    desc: Force migration version (task migrate:force -- 1)
    requires:
      vars: [CLI_ARGS]
    cmd: migrate -path {{.MIGRATIONS}} -database "{{.DB_URL}}" force {{.CLI_ARGS}}

  migrate:version:
    desc: Show the current schema version
    cmd: migrate -path {{.MIGRATIONS}} -database "{{.DB_URL}}" version

  auth:env:
    desc: Copy Terraform outputs (issuer, audience, web client) into the backend .env
    cmds:
      - touch .env
      - |
        set -eu
        upsert() {
          v="$(terraform -chdir=infra/auth0 output -raw "$2")" # plain assignment so set -e catches failures
          K="$1" V="$v" awk '
            $0 ~ "^" ENVIRON["K"] "=" { print ENVIRON["K"] "=\"" ENVIRON["V"] "\""; done = 1; next }
            { print }
            END { if (!done) print ENVIRON["K"] "=\"" ENVIRON["V"] "\"" }
          ' .env > .env.tmp
          cat .env.tmp > .env
          rm .env.tmp
        }
        upsert AUTH_ISSUER auth_issuer
        upsert AUTH_AUDIENCE auth_audience
        upsert CLI_AUTH0_CLIENT_ID cli_client_id
        echo "Updated .env from Terraform outputs."
