version: "3"

dotenv: [".env"]

vars:
  MIGRATIONS: migrations

tasks:
  test:coverage:
    cmds:
      - go test ./... -race -coverpkg=./... -coverprofile=raw_coverage.out
      - grep -vE '/(actortest|accounttest)/' raw_coverage.out > coverage.out

  lint: golangci-lint run

  openapi:
    cmds:
      - go run ./cmd/server openapi > api/openapi.yaml
      - go tool oapi-codegen -config oapi-codegen.yaml api/openapi.yaml

  db:lint: squawk '{{.MIGRATIONS}}/*.sql'
  db:sqlc:
    - sqlc generate -f sqlc.yaml
    - sqlc vet -f sqlc.yaml
  db:schema: ./scripts/db-schema.sh
  db:up: go run ./cmd/server migrate
  db:*:
    desc: task db:down | db:status | db:redo | db:create -- add_foo
    vars:
      GOOSE_CMD: "{{index .MATCH 0}}"
    env:
      GOOSE_DRIVER: postgres
      GOOSE_MIGRATION_DIR: "{{.MIGRATIONS}}"
    # $DATABASE_URL, not {{.DATABASE_URL}}: the template always takes .env, the shell var lets an
    # exported value win (same precedence as the server).
    cmd: GOOSE_DBSTRING="$DATABASE_URL" goose -s {{.GOOSE_CMD}} {{if eq .GOOSE_CMD "create"}}{{.CLI_ARGS}} sql{{end}}

  auth:env:
    desc: Copy Terraform outputs (issuer, audience, web client) into the backend .env
    cmds:
      - touch .env
      - |
        set -eu
        upsert() {
          v="$(terraform -chdir=infra/auth0 output -raw "$2")" # plain assignment so set -e catches failures
          K="$1" V="$v" awk '
            $0 ~ "^" ENVIRON["K"] "=" { print ENVIRON["K"] "=\"" ENVIRON["V"] "\""; done = 1; next }
            { print }
            END { if (!done) print ENVIRON["K"] "=\"" ENVIRON["V"] "\"" }
          ' .env > .env.tmp
          cat .env.tmp > .env
          rm .env.tmp
        }
        upsert AUTH_ISSUER auth_issuer
        upsert AUTH_AUDIENCE auth_audience
        upsert CLI_AUTH0_CLIENT_ID cli_client_id
        echo "Updated .env from Terraform outputs."
