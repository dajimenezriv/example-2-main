components:
  schemas:
    AccountItem:
      additionalProperties: false
      properties:
        dltAccountId:
          type: string
        id:
          format: uuid
          type: string
        publicKey:
          type: string
        version:
          format: int64
          type: integer
      required:
        - id
        - dltAccountId
        - publicKey
        - version
      type: object
    ActorAccountItem:
      additionalProperties: false
      properties:
        dltAccountId:
          type: string
        id:
          format: uuid
          type: string
        publicKey:
          type: string
      required:
        - id
        - dltAccountId
        - publicKey
      type: object
    ActorItem:
      additionalProperties: false
      properties:
        accounts:
          items:
            $ref: "#/components/schemas/ActorAccountItem"
          nullable: true
          type: array
        id:
          format: uuid
          type: string
        taxId:
          type: string
        type:
          type: string
        version:
          format: int64
          type: integer
      required:
        - id
        - taxId
        - type
        - version
        - accounts
      type: object
    CreateAccountRequest:
      additionalProperties: false
      properties:
        actorId:
          format: uuid
          type: string
        dltAccountId:
          minLength: 1
          type: string
        privateKey:
          minLength: 1
          type: string
        publicKey:
          minLength: 1
          type: string
      required:
        - actorId
        - dltAccountId
        - privateKey
        - publicKey
      type: object
    CreateAccountResponse:
      additionalProperties: false
      properties:
        actorId:
          format: uuid
          type: string
        dltAccountId:
          type: string
        id:
          format: uuid
          type: string
        publicKey:
          type: string
      required:
        - id
        - actorId
        - dltAccountId
        - publicKey
      type: object
    CreateActorRequest:
      additionalProperties: false
      properties:
        taxId:
          example: "123456789"
          pattern: ^\d{9}$
          patternDescription: 9 digits
          type: string
        type:
          enum:
            - issuer
            - investor
            - platform_admin
            - market_operator
            - settlement_operator
            - custom
          type: string
      required:
        - taxId
        - type
      type: object
    CreateActorResponse:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        taxId:
          type: string
        type:
          type: string
        version:
          format: int64
          type: integer
      required:
        - id
        - taxId
        - type
        - version
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    GetAccountsResponse:
      additionalProperties: false
      properties:
        accounts:
          items:
            $ref: "#/components/schemas/AccountItem"
          nullable: true
          type: array
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
        totalCount:
          format: int64
          type: integer
      required:
        - accounts
        - totalCount
        - hasNext
        - hasPrevious
      type: object
    GetActorsResponse:
      additionalProperties: false
      properties:
        actors:
          items:
            $ref: "#/components/schemas/ActorItem"
          nullable: true
          type: array
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
        totalCount:
          format: int64
          type: integer
      required:
        - actors
        - totalCount
        - hasNext
        - hasPrevious
      type: object
    UpdateActorRequest:
      additionalProperties: false
      properties:
        taxId:
          example: "123456789"
          pattern: ^\d{9}$
          patternDescription: 9 digits
          type: string
        type:
          enum:
            - issuer
            - investor
            - platform_admin
            - market_operator
            - settlement_operator
            - custom
          type: string
        version:
          format: int64
          minimum: 1
          type: integer
      required:
        - version
      type: object
    UpdateActorResponse:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        taxId:
          type: string
        type:
          type: string
        version:
          format: int64
          type: integer
      required:
        - id
        - taxId
        - type
        - version
      type: object
info:
  title: Participants API
  version: 1.0.0
openapi: 3.0.3
paths:
  /accounts:
    get:
      operationId: list-accounts
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            default: 20
            format: int32
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            default: 0
            format: int32
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAccountsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List accounts
      tags:
        - Accounts
    post:
      operationId: create-account
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAccountResponse"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Create an account
      tags:
        - Accounts
  /actors:
    get:
      operationId: list-actors
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            default: 20
            format: int32
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            default: 0
            format: int32
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetActorsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List actors with their accounts
      tags:
        - Actors
    post:
      operationId: create-actor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActorRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateActorResponse"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Create an actor
      tags:
        - Actors
  /actors/{id}:
    patch:
      operationId: update-actor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActorRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateActorResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Update an actor
      tags:
        - Actors
