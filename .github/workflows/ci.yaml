name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: golangci/golangci-lint-action@v9
        with:
          install-mode: none

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: task test:coverage
      - run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: go mod tidy -diff
      - run: sqlc diff -f sqlc.yaml
      - run: sqlc vet -f sqlc.yaml
      - run: squawk 'migrations/*.sql'
      - run: |
          ./scripts/schema-dump.sh
          git diff --exit-code -- db/schema.sql
