version: "2"

linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - ireturn
    - lll
    - nlreturn
    - noinlineerr
    - paralleltest
    - tagalign
    - testpackage
    - varnamelen
    - wsl
    - wsl_v5

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gocritic:
      enable-all: true
      disabled-checks:
        - hugeParam
    wrapcheck:
      # Overrides the defaults, so they are restated here.
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        # Returning ctx.Err() as-is is idiomatic (context.Canceled / DeadlineExceeded).
        - func (context.Context).Err() error

  exclusions:
    generated: strict
    warn-unused: true
    presets:
      - comments
    rules:
      - path: (_test\.go$|test/|testhelpers/)
        linters:
          - errcheck
          - gochecknoglobals

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: exercise
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - exercise

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
